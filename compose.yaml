services:
  postgres:
    image: postgres:18.7
    ports:
      - "127.0.0.1:${DSE_PG_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: dse
      POSTGRES_USER: dse_owner
      POSTGRES_PASSWORD: ${DSE_PG_PASSWORD:?Set DSE_PG_PASSWORD for this development database}
    volumes:
      - atlas-data:/var/lib/postgresql
      - ./migrations/001_atlas.sql:/docker-entrypoint-initdb.d/001_atlas.sql:ro
      - ./migrations/002_commit.sql:/docker-entrypoint-initdb.d/002_commit.sql:ro
      - ./tests/catalog.sql:/checks/catalog.sql:ro
      - ./migrations/provision_client.psql:/checks/provision_client.psql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dse_owner -d dse"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  atlas-data:
